name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on branches/PRs, but let every commit on main finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: clang-format check
        run: git ls-files '*.cpp' '*.hpp' '*.hip' | xargs clang-format --dry-run --Werror

  build-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libomp-dev
      - name: Configure
        run: cmake --preset dev -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build
        run: cmake --build --preset dev
      - name: Run planet_sim (short real runs; exit code 2 means the physics produced NaN)
        run: |
          ./build/dev/planet_sim --scenario figure8 --steps 2000
          ./build/dev/planet_sim --scenario cloud --n 500 --steps 20 --backend omp --bench
      - name: Run bench_gravity (smoke run, so the benchmark can't silently break)
        run: ./build/dev/bench_gravity 500 1
      - name: Test (1 thread)
        run: ctest --preset dev
        env:
          OMP_NUM_THREADS: 1
      - name: Test (4 threads)
        run: ctest --preset dev
        env:
          OMP_NUM_THREADS: 4

  asan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libomp-dev
      - run: cmake --preset asan
      - run: cmake --build --preset asan
      - run: ctest --preset asan

  # Data races in OpenMP code (#21). TSan alone doesn't understand OpenMP's
  # synchronization; LLVM's Archer tool, loaded through OMP_TOOL_LIBRARIES, teaches it.
  tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libomp-dev
      - name: Find Archer
        run: |
          ARCHER=$(find /usr/lib -name 'libarcher.so*' | head -n 1)
          if [ -z "$ARCHER" ]; then echo "libarcher.so not found"; exit 1; fi
          echo "Archer: $ARCHER"
          echo "OMP_TOOL_LIBRARIES=$ARCHER" >> "$GITHUB_ENV"
      - name: Canary (TSan must catch a deliberate race)
        run: |
          clang++ -g -fsanitize=thread -fopenmp .github/ci/tsan_canary.cpp -o tsan_canary
          OMP_NUM_THREADS=4 TSAN_OPTIONS=ignore_noninstrumented_modules=1 ./tsan_canary > canary.log 2>&1 || true
          if grep -q "ThreadSanitizer: data race" canary.log; then
            echo "TSan caught the deliberate race: race checking works."
          else
            cat canary.log
            echo "TSan did NOT catch the deliberate race: race checking is misconfigured."
            exit 1
          fi
      - run: cmake --preset tsan
      - run: cmake --build --preset tsan
      - name: Test under TSan (4 threads, preset sets OMP_NUM_THREADS and TSAN_OPTIONS)
        run: ctest --preset tsan

  # HIP GPU backend (#24). GitHub's runners have no GPU, so this compiles the HIP code
  # for the RX 9060 XT (gfx1200) and runs everything except the gpu-labelled tests.
  # Same ROCm version as the dev machine (Arch: 7.2.4).
  hip-compile:
    runs-on: ubuntu-24.04
    container: rocm/dev-ubuntu-24.04:7.2.4
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: apt-get update && apt-get install -y cmake ninja-build g++
      - run: cmake --preset hip
      - run: cmake --build --preset hip
      - name: Test (CPU tests in a HIP build; no GPU here)
        run: ctest --preset hip -LE gpu
      - name: --backend hip without a GPU must fail cleanly (exit 1 and a message), not crash
        run: |
          set +e
          ./build/hip/planet_sim --scenario orbit --backend hip > out.log 2>&1
          code=$?
          cat out.log
          if [ "$code" -ne 1 ] || ! grep -q "no usable GPU found" out.log; then
            echo "expected exit 1 with 'no usable GPU found', got exit $code"
            exit 1
          fi
