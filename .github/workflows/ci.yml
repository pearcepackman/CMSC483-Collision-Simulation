name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on branches/PRs, but let every commit on main finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: clang-format check
        run: git ls-files '*.cpp' '*.hpp' '*.hip' | xargs clang-format --dry-run --Werror

  build-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libomp-dev
      - name: Configure
        run: cmake --preset dev -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build
        run: cmake --build --preset dev
      - name: Run planet_sim
        run: ./build/dev/planet_sim
      - name: Test (1 thread)
        run: ctest --preset dev
        env:
          OMP_NUM_THREADS: 1
      - name: Test (4 threads)
        run: ctest --preset dev
        env:
          OMP_NUM_THREADS: 4

  asan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libomp-dev
      - run: cmake --preset asan
      - run: cmake --build --preset asan
      - run: ctest --preset asan
