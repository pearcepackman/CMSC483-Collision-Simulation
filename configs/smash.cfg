# The destruction run: a quarter-mass impactor slams into a planet at about 3 times their
# mutual escape speed, 15 degrees off center. Both planets have iron cores. The impactor
# is torn apart, a long jet of debris (its core included) streams away, and about a third
# of all particles end up far from what's left of the target.
# Simulation units, G = 1. Run: planet_view --config configs/smash.cfg --backend hip
# (10,000 particles: relaxing them takes a while on serial, about 30 s on the GPU, and
# pressing r in the viewer relaxes them again).

# Mutual escape speed sqrt(2 (M0 + M1) / (R0 + R1)) = 1.75, so 3x is 5.25 at contact. Starting
# 4 apart, gravity adds a little on the way in, so they start at 5.08 relative.
# Particles are smaller and lighter than in head_on.cfg, so the contact spring period
# 2 pi sqrt(m_eff / k) for two mantle particles (mass 2.0e-4 each) is 0.0141: dt = 0.001
# keeps about 14 steps per period.
dt = 0.001
softening = 0.03
contact = true
contact_k = 20
# Bouncy contacts (damping ratio 0.11, restitution 0.70: a bounce keeps about half its
# energy), so debris sprays out instead of sticking. c * dt / m_eff = 0.099 for the
# lightest pair, far below the limit of 2.
contact_c = 0.01

steps = 4000       # t = 4
output_every = 40  # 101 frames

relax_drag = 5
relax_ke_threshold = 1e-6
relax_max_steps = 4000

# Target: 8,000 particles, mass 2, radius 1, Earth-like core (core_radius_fraction of the
# radius the particle centers fill; iron 2.5x as dense as rock).
planet0.n = 8000
planet0.radius = 1.0
planet0.particle_radius = 0.041
planet0.mass = 2.0
planet0.center = 0.800000 -0.087295 0
planet0.velocity = -1.015686 0 0
planet0.seed = 1
planet0.core_radius_fraction = 0.55
planet0.core_density_ratio = 2.5

# Impactor: a quarter of the mass, same density and particle mass, so its radius is
# 1 x 0.25^(1/3) = 0.63. Positions and velocities put the center of mass at rest at the
# origin.
planet1.n = 2000
planet1.radius = 0.629961
planet1.particle_radius = 0.041
planet1.mass = 0.5
planet1.center = -3.200000 0.349182 0
planet1.velocity = 4.062746 0 0
planet1.seed = 2
planet1.core_radius_fraction = 0.55
planet1.core_density_ratio = 2.5
