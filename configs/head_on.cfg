# Two equal planets start at half their escape speed and fall together head-on. Gravity
# speeds them up to about 1.84 (92% of escape speed) at contact; their total energy is
# negative (-0.3), so they should merge.
# Simulation units, G = 1. Run: planet_sim --config configs/head_on.cfg --out frames/head_on

# Contact spring period 2*pi*sqrt(m_eff/k) with m_eff = 1e-3/2 is 0.031, so dt is
# T/15.7 (keep dt <= T/10). Damper: c*dt/m_eff = 0.2 (must stay well under 2).
dt = 0.002
softening = 0.05
contact = true
contact_k = 20
contact_c = 0.05

steps = 5000      # t = 10
output_every = 25 # 201 frames

# Relaxation (#15): before the impact, each planet settles on its own at rest, with
# its velocities multiplied by exp(-relax_drag * dt) after every step. It stops once
# kinetic energy has stayed below relax_ke_threshold for one dynamical time
# sqrt(R^3/M) of the planet (about 320 steps here; each planet settles in about 866
# steps), or after relax_max_steps. The hold is a time, so a smaller dt (--dt) needs a
# larger relax_max_steps: at dt / 4 the hold alone is about 1,280 steps.
relax_drag = 5
relax_ke_threshold = 1e-6
relax_max_steps = 2000

# 2,000 particles of mass 1e-3 in a unit ball. 0.065 is about where FCC neighbors
# just touch (docs/notes.md, planet generation). Escape speed of the pair:
# sqrt(2 * (2 + 2) / (1 + 1)) = 2; the relative speed here is 1.
planet0.n = 2000
planet0.radius = 1.0
planet0.particle_radius = 0.065
planet0.mass = 2.0
planet0.center = -2.5 0 0
planet0.velocity = 0.5 0 0
planet0.seed = 1
# Layered planets (#50): an iron core inside a rock mantle, same particle size, core
# particles denser. Left out here, so both planets are uniform rock. Earth-like values:
# planet0.core_radius_fraction = 0.55   (of the radius the particle centers fill)
# planet0.core_density_ratio = 2.5      (iron / rock)

planet1.n = 2000
planet1.radius = 1.0
planet1.particle_radius = 0.065
planet1.mass = 2.0
planet1.center = 2.5 0 0
planet1.velocity = -0.5 0 0
planet1.seed = 2
