# Two equal planets start at half their escape speed and fall together head-on. Gravity
# speeds them up to about 1.84 (92% of escape speed) at contact; their total energy is
# negative (-0.3), so they should merge.
# Simulation units, G = 1. Run: planet_sim --config configs/head_on.cfg --out frames/head_on

# Contact spring period 2*pi*sqrt(m_eff/k) with m_eff = 1e-3/2 is 0.031, so dt is
# T/15.7 (keep dt <= T/10). Damper: c*dt/m_eff = 0.2 (must stay well under 2).
dt = 0.002
softening = 0.05
contact = true
contact_k = 20
contact_c = 0.05

steps = 5000      # t = 10
output_every = 25 # 201 frames

# Relaxation lands with #15. Until then the planets start unrelaxed.
relax_ke_threshold = 0
relax_max_steps = 0

# 2,000 particles of mass 1e-3 in a unit ball. 0.065 is about where FCC neighbors
# just touch (docs/notes.md, planet generation). Escape speed of the pair:
# sqrt(2 * (2 + 2) / (1 + 1)) = 2; the relative speed here is 1.
planet0.n = 2000
planet0.radius = 1.0
planet0.particle_radius = 0.065
planet0.mass = 2.0
planet0.center = -2.5 0 0
planet0.velocity = 0.5 0 0
planet0.seed = 1

planet1.n = 2000
planet1.radius = 1.0
planet1.particle_radius = 0.065
planet1.mass = 2.0
planet1.center = 2.5 0 0
planet1.velocity = -0.5 0 0
planet1.seed = 2
