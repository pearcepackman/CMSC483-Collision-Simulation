# Small, fast collision for CI (#17): 500 particles. First contact is at about step 210,
# and at step 600 the planets are still pressed together, so the run covers the impact
# (about 0.5 s of simulation in a release build).
# Same particle mass and contact settings as head_on.cfg, at 1/8 the planet volume.

dt = 0.002
softening = 0.05
contact = true
contact_k = 20
contact_c = 0.05

steps = 600
output_every = 10

# Relaxation (#15): before the impact, each planet settles on its own at rest, with
# its velocities multiplied by exp(-relax_drag * dt) after every step. It stops once
# kinetic energy has stayed below relax_ke_threshold for one dynamical time
# sqrt(R^3/M) of the planet (about 290 steps here; each planet settles in about 500
# steps), or after relax_max_steps. The hold is a time, so a smaller dt (--dt) needs a
# larger relax_max_steps: at dt / 4 the hold alone is about 1,160 steps.
relax_drag = 5
relax_ke_threshold = 1e-6
relax_max_steps = 2000

# 250 particles of mass 1e-3 in a ball of radius 0.5. make_planet refuses particle
# radii above about 0.063 here, so 0.06 (about 95% of the limit, like head_on.cfg).
# The surfaces start 0.1 apart and close at 0.5, which alone would take 100 steps, but
# relaxation shrinks each planet a little, so the first particles touch at about step 210.
planet0.n = 250
planet0.radius = 0.5
planet0.particle_radius = 0.06
planet0.mass = 0.25
planet0.center = -0.55 0 0
planet0.velocity = 0.25 0 0
planet0.seed = 1

planet1.n = 250
planet1.radius = 0.5
planet1.particle_radius = 0.06
planet1.mass = 0.25
planet1.center = 0.55 0 0
planet1.velocity = -0.25 0 0
planet1.seed = 2
