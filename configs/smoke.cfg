# Small, fast collision for CI (#17): 500 particles that touch within 200 steps.
# Same particle mass and contact settings as head_on.cfg, at 1/8 the planet volume.

dt = 0.002
softening = 0.05
contact = true
contact_k = 20
contact_c = 0.05

steps = 200
output_every = 20

# Relaxation lands with #15.
relax_ke_threshold = 0
relax_max_steps = 0

# 250 particles of mass 1e-3 in a ball of radius 0.5. make_planet refuses particle
# radii above about 0.063 here, so 0.06 (about 95% of the limit, like head_on.cfg).
# The surfaces start 0.1 apart and close at 0.5, so they touch after about 100 steps
# (sooner, with gravity).
planet0.n = 250
planet0.radius = 0.5
planet0.particle_radius = 0.06
planet0.mass = 0.25
planet0.center = -0.55 0 0
planet0.velocity = 0.25 0 0
planet0.seed = 1

planet1.n = 250
planet1.radius = 0.5
planet1.particle_radius = 0.06
planet1.mass = 0.25
planet1.center = 0.55 0 0
planet1.velocity = -0.25 0 0
planet1.seed = 2
