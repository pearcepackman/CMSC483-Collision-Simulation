# How scripts/testdata/relaxed_layered_500/frame_00000.csv was made (#67): one layered
# planet relaxed by planet_sim, then frame 0 kept. Regenerate with
#   ./build/dev/planet_sim --config scripts/testdata/relaxed_layered_500/planet.cfg --out /tmp/one
dt = 0.002
softening = 0.05
contact = true
contact_k = 20
contact_c = 0.01
steps = 1
output_every = 1
relax_drag = 5
relax_ke_threshold = 1e-6
relax_max_steps = 4000
planet0.n = 500
planet0.radius = 1.0
planet0.particle_radius = 0.1
planet0.mass = 1.0
planet0.seed = 3
planet0.core_radius_fraction = 0.55
planet0.core_density_ratio = 2.5
